name: Feature request
description: Propose a focused capability or maintainer workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or user problem should disappear?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and demo
      description: What visible or reproducible result would prove this is useful?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe the smallest useful vertical slice and what should stay out of scope.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data, security, or permission boundary
      description: Note any repository writes, secrets, private data, model licenses, or external services involved.
