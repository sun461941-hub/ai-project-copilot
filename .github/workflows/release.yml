name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Validate and test
        run: |
          python tools/validate_skill.py skills/ai-project-copilot
          python skills/ai-project-copilot/scripts/run_skill_evals.py --format json
          python -m unittest discover -s tests -v

      - name: Build release archive
        run: >-
          python tools/package_skill.py skills/ai-project-copilot
          --output dist/ai-project-copilot.skill.zip

      - name: Write checksum
        run: >-
          python -c "from pathlib import Path; import hashlib;
          p=Path('dist/ai-project-copilot.skill.zip');
          Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n', encoding='utf-8')"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/ai-project-copilot.skill.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "AI Project Copilot ${GITHUB_REF_NAME}"
