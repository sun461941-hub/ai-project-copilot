name: Apply fix6 source patch

on:
  workflow_dispatch:
    inputs:
      output_branch:
        description: "New review branch (normally fix6-ready)"
        required: true
        default: "fix6-ready"
        type: string
      confirmation:
        description: "Type APPLY_FIX6 to authorize creation of the review branch"
        required: true
        type: string

concurrency:
  group: apply-fix6-${{ inputs.output_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == github.repository_owner && inputs.confirmation == 'APPLY_FIX6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Validate output branch
        shell: bash
        env:
          OUTPUT_BRANCH: ${{ inputs.output_branch }}
        run: |
          python - "$OUTPUT_BRANCH" <<'PY'
          import subprocess
          import sys

          branch = sys.argv[1]
          if branch in {"main", "master"}:
              raise SystemExit("output branch must not be a protected primary branch")
          checked = subprocess.run(
              ["git", "check-ref-format", "--branch", branch],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if checked.returncode != 0:
              raise SystemExit("invalid or unsafe output branch name")
          result = subprocess.run(
              ["git", "ls-remote", "--exit-code", "--heads", "origin", branch],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if result.returncode == 0:
              raise SystemExit(f"remote branch already exists: {branch}")
          if result.returncode not in (0, 2):
              raise SystemExit("could not verify remote branch state")
          PY
          test -z "$(git status --porcelain)"

      - name: Apply exact fix6 source patch
        run: python tools/apply_fix6_mobile_release.py --repo .

      - name: Verify patch and run full checks
        run: |
          python tools/apply_fix6_mobile_release.py --repo . --check
          python tools/validate_skill.py skills/ai-project-copilot
          python skills/ai-project-copilot/scripts/run_skill_evals.py --format json
          python -m unittest discover -s tests -v
          python -m compileall -q tools tests skills/ai-project-copilot/scripts

      - name: Verify changed-file allowlist
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "CHANGELOG.md",
              "skills/ai-project-copilot/scripts/model_budget_gateway.py",
              "tests/test_fix6_gateway_hardening.py",
          }
          status_lines = [
              line
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1"], text=True
              ).splitlines()
              if line
          ]
          paths = {line[3:] for line in status_lines}
          unexpected = sorted(paths - allowed)
          missing = sorted({
              "skills/ai-project-copilot/scripts/model_budget_gateway.py",
              "tests/test_fix6_gateway_hardening.py",
          } - paths)
          if unexpected:
              raise SystemExit("unexpected changed files: " + ", ".join(unexpected))
          if missing:
              raise SystemExit("expected fix6 changes are missing: " + ", ".join(missing))
          PY

      - name: Commit to a new review branch
        shell: bash
        env:
          OUTPUT_BRANCH: ${{ inputs.output_branch }}
        run: |
          git switch -c "$OUTPUT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md \
            skills/ai-project-copilot/scripts/model_budget_gateway.py \
            tests/test_fix6_gateway_hardening.py
          git diff --cached --check
          git commit -m "fix: apply fix6 gateway hardening"
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          {
            echo "## fix6 review branch created"
            echo
            echo "Branch: \`${OUTPUT_BRANCH}\`"
            echo
            echo "Open this comparison and create a pull request:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...${OUTPUT_BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
