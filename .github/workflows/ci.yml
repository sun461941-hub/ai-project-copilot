name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime diagnostics
        run: >-
          python -c "import os, platform, sys;
          print('python=', sys.version.replace('\n', ' '));
          print('executable=', sys.executable);
          print('platform=', platform.platform());
          print('cwd=', os.getcwd());
          print('utf8_mode=', sys.flags.utf8_mode)"

      - name: Validate skill
        run: python tools/validate_skill.py skills/ai-project-copilot

      - name: Run deterministic Skill evals
        run: >-
          python skills/ai-project-copilot/scripts/run_skill_evals.py
          --format json

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q tools tests skills/ai-project-copilot/scripts

  package:
    name: Build distributable skill
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Runtime diagnostics
        run: >-
          python -c "import platform, sys;
          print('python=', sys.version.replace('\n', ' '));
          print('platform=', platform.platform())"

      - name: Build deterministic archive
        run: >-
          python tools/package_skill.py skills/ai-project-copilot
          --output dist/ai-project-copilot.skill.zip

      - name: Write checksum
        run: >-
          python -c "from pathlib import Path; import hashlib;
          p=Path('dist/ai-project-copilot.skill.zip');
          Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n', encoding='utf-8')"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-project-copilot-skill
          path: |
            dist/ai-project-copilot.skill.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
