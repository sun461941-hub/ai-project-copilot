name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate skill
        run: python tools/validate_skill.py skills/ai-project-copilot

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q tools tests skills/ai-project-copilot/scripts

  package:
    name: Build distributable skill
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build deterministic archive
        run: >-
          python tools/package_skill.py skills/ai-project-copilot
          --output dist/ai-project-copilot.skill.zip

      - name: Write checksum
        run: >-
          python -c "from pathlib import Path; import hashlib;
          p=Path('dist/ai-project-copilot.skill.zip');
          Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n', encoding='utf-8')"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ai-project-copilot-skill
          path: |
            dist/ai-project-copilot.skill.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
