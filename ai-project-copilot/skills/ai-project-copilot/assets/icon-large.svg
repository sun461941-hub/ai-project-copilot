<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AI Project Copilot</title>
  <desc id="desc">A dark rounded tile with a colorful flight path, connected product nodes, and a star.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="472" x2="472" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111A35"/>
      <stop offset="1" stop-color="#080B16"/>
    </linearGradient>
    <linearGradient id="g" x1="100" y1="420" x2="420" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21D4FD"/>
      <stop offset="0.5" stop-color="#6D5EF9"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="132" fill="url(#bg)"/>
  <path d="M106 374c64-132 153-195 304-192-71 49-104 105-108 177-67-22-128-17-196 15Z" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="109" cy="377" r="27" fill="#FFFFFF"/>
  <circle cx="246" cy="241" r="18" fill="#21D4FD"/>
  <circle cx="319" cy="205" r="18" fill="#B49CFF"/>
  <path d="m399 78 14 34 34 14-34 14-14 34-14-34-34-14 34-14 14-34Z" fill="#FFFFFF"/>
</svg>
