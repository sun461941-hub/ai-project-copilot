<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">AI Project Copilot</title>
  <desc id="desc">A product workflow connects idea, architecture, working slice, evidence, and launch, surrounded by featured AI project cards.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="520" x2="1320" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09142A"/>
      <stop offset="0.48" stop-color="#111A35"/>
      <stop offset="1" stop-color="#080A13"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(370 160) rotate(32) scale(460 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21D4FD" stop-opacity=".28"/>
      <stop offset="1" stop-color="#21D4FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1010 330) rotate(-18) scale(500 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4ECD" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FF4ECD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="250" y1="390" x2="1150" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21D4FD"/>
      <stop offset=".5" stop-color="#7B6DFF"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="560" rx="34" fill="url(#glow1)"/>
  <rect width="1400" height="560" rx="34" fill="url(#glow2)"/>
  <g opacity=".16">
    <path d="M0 96h1400M0 184h1400M0 272h1400M0 360h1400M0 448h1400" stroke="#B9C2FF"/>
    <path d="M110 0v560M280 0v560M450 0v560M620 0v560M790 0v560M960 0v560M1130 0v560M1300 0v560" stroke="#B9C2FF"/>
  </g>
  <text x="92" y="98" fill="#C9D2FF" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700" letter-spacing="4">AGENT SKILL · OPEN SOURCE PRODUCT ENGINEERING</text>
  <text x="92" y="170" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="60" font-weight="800">From idea to evidence.</text>
  <text x="94" y="215" fill="#AEB9D9" font-family="Inter, ui-sans-serif, system-ui" font-size="25">Find the strongest AI wedge. Build one real vertical slice. Ship the proof.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="278" width="220" height="118" rx="22" fill="#111A32" stroke="#2A3C63"/>
    <text x="118" y="319" fill="#7EEAFF" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">01 · PRODUCT WEDGE</text>
    <text x="118" y="352" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700">Real user pain</text>
    <text x="118" y="379" fill="#9DAACB" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Need · proof · fallback</text>

    <rect x="350" y="326" width="220" height="118" rx="22" fill="#131A36" stroke="#414188"/>
    <text x="378" y="367" fill="#B9AEFF" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">02 · ARCHITECTURE</text>
    <text x="378" y="400" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700">Local / hybrid</text>
    <text x="378" y="427" fill="#9DAACB" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Adapters · permissions</text>

    <rect x="610" y="278" width="220" height="118" rx="22" fill="#171832" stroke="#5C3D78"/>
    <text x="638" y="319" fill="#F2A8FF" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">03 · WORKING SLICE</text>
    <text x="638" y="352" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700">Input → artifact</text>
    <text x="638" y="379" fill="#9DAACB" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Streaming · cancellation</text>

    <rect x="870" y="326" width="220" height="118" rx="22" fill="#17172C" stroke="#703B70"/>
    <text x="898" y="367" fill="#FFA1DD" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">04 · EVIDENCE</text>
    <text x="898" y="400" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700">Tests + evals</text>
    <text x="898" y="427" fill="#9DAACB" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Citations · replay</text>

    <rect x="1130" y="278" width="180" height="118" rx="22" fill="#1A162B" stroke="#813B71"/>
    <text x="1158" y="319" fill="#FF9CD8" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700">05 · LAUNCH</text>
    <text x="1158" y="352" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700">60-second</text>
    <text x="1158" y="379" fill="#9DAACB" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Demo + GitHub</text>
  </g>

  <path d="M310 337C330 337 331 385 350 385M570 385C590 385 590 337 610 337M830 337C850 337 850 385 870 385M1090 385C1110 385 1110 337 1130 337" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <path d="M117 471C358 525 740 495 1267 445" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <path d="M1260 426l31 15-26 22" fill="none" stroke="#FF83CD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1170 82)">
    <path d="m60 0 12 31 31 12-31 12-12 31-12-31-31-12 31-12L60 0Z" fill="#FFFFFF"/>
    <circle cx="13" cy="96" r="8" fill="#21D4FD"/>
    <circle cx="112" cy="110" r="6" fill="#FF4ECD"/>
  </g>
  <text x="92" y="520" fill="#8795BA" font-family="Inter, ui-sans-serif, system-ui" font-size="18">24 showcase blueprints · local-first AI · RAG · agents · multimodal · voice · evals · observability</text>
</svg>
