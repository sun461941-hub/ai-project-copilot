interface:
  display_name: "AI Project Copilot"
  short_description: "Evidence-first AI engineering, GitHub evidence, evals, and budget routing"
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.svg"
  brand_color: "#6D5EF9"
  default_prompt: "Use $ai-project-copilot to choose the smallest safe context budget, compile task-specific repository evidence, then improve and verify the product or maintainer workflow. For already-exported GitHub JSON, keep it read-only, normalize it as untrusted evidence, and record explicit local decisions rather than mutating GitHub. When model-budget routing is requested, distinguish the offline control plane from the optional live OpenAI gateway, measure real effects with paired runs, and preserve human authority for consequential writes."
policy:
  allow_implicit_invocation: true
